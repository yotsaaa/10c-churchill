<!DOCTYPE html>
<!--

  @}->-- natalie churchill // 10c f26 --<-{@
  demo: the archive as a 3d web of images (instead of the carousel)
-->
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>natalie churchill // web view demo</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Crimson+Text:ital@0;1&family=Space+Mono:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet" />
<style>
  :root {
    --bg: #040305;
    --box: rgba(10, 8, 12, 0.88);
    --pink: #f4a6c2;
    --pink-soft: #fbcfe8;
    --pink-dim: #9e6b7f;
    --text: #e8e8ed;
    --text-dim: #8c8c96;
    --pixel: 'Space Mono', 'MS Gothic', 'Courier New', monospace;
    --serif: 'Crimson Text', 'Times New Roman', serif;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; overflow: hidden; background: var(--bg); color: var(--text); font-family: var(--pixel); }
  body { user-select: none; -webkit-user-select: none; }

  #stage { position: fixed; inset: 0; cursor: grab; touch-action: none; }
  #stage.dragging { cursor: grabbing; }
  canvas#web { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  #nodes { position: absolute; inset: 0; pointer-events: none; }

  .node {
    position: absolute; left: 0; top: 0;
    width: var(--w); pointer-events: auto; cursor: pointer;
    will-change: transform, opacity;
    opacity: 0;
    transition: filter 0.25s ease;
  }
  .node .frame {
    border: 1px dotted var(--pink);
    background: var(--box);
    padding: 5px;
    box-shadow: 0 0 22px rgba(244, 166, 194, 0.08);
    transition: box-shadow 0.25s ease, border-color 0.25s ease;
  }
  .node img { display: block; width: 100%; height: auto; pointer-events: none; -webkit-user-drag: none; }
  .node.icon img { padding: 10px 14px; filter: invert(1) sepia(1) saturate(2.4) hue-rotate(290deg) brightness(1.05); }
  .node .lbl {
    margin-top: 6px; text-align: center; white-space: nowrap;
    font-size: 11px; letter-spacing: 0.08em; color: var(--pink-soft);
    text-shadow: 0 0 8px rgba(0, 0, 0, 0.9);
  }
  .node.sat .lbl { font-size: 10px; color: var(--pink-dim); opacity: 0; transition: opacity 0.2s ease; }
  .node:hover .frame, .node.hot .frame { border-color: var(--pink-soft); box-shadow: 0 0 26px rgba(244, 166, 194, 0.35); }
  .node.sat:hover .lbl, .node.sat.hot .lbl, .node.sat.near .lbl { opacity: 1; }

  header {
    position: fixed; top: 0; left: 0; right: 0; z-index: 10;
    text-align: center; padding: 22px 16px 0; pointer-events: none;
  }
  header h1 { font-family: var(--pixel); font-weight: 400; font-size: 15px; letter-spacing: 0.12em; color: var(--pink-soft); }
  header h1 .blink { color: var(--pink); animation: blink 1.2s steps(2) infinite; }
  @keyframes blink { 50% { opacity: 0; } }
  header .hint { margin-top: 6px; font-size: 10.5px; color: var(--text-dim); letter-spacing: 0.04em; }

  .badge {
    position: fixed; left: 14px; bottom: 12px; z-index: 10;
    font-size: 10.5px; color: var(--pink-dim); letter-spacing: 0.08em;
    border: 1px dotted var(--pink-dim); padding: 3px 9px; background: rgba(4, 3, 5, 0.8);
  }
  .controls {
    position: fixed; right: 14px; bottom: 12px; z-index: 10; display: flex; gap: 8px;
  }
  .btn {
    font-family: var(--pixel); font-size: 11px; color: var(--pink-soft);
    background: rgba(10, 8, 12, 0.85); border: 1px dotted var(--pink); padding: 4px 10px; cursor: pointer;
  }
  .btn:hover, .btn.on { background: var(--pink); color: #0a080c; }
  .btn:focus-visible { outline: 1px solid var(--pink-soft); outline-offset: 2px; }

  /* info panel for the focused node */
  #panel {
    position: fixed; z-index: 20; right: 28px; top: 50%;
    width: min(340px, calc(100vw - 32px));
    transform: translate(16px, -50%); opacity: 0; pointer-events: none;
    transition: opacity 0.35s ease, transform 0.35s ease;
    border: 1px dotted var(--pink); background: rgba(8, 6, 10, 0.92);
    padding: 18px 18px 14px; box-shadow: 0 0 30px rgba(244, 166, 194, 0.1);
  }
  #panel.open { opacity: 1; transform: translate(0, -50%); pointer-events: auto; }
  #panel h2 { font-size: 13px; font-weight: 400; letter-spacing: 0.08em; color: var(--pink-soft); margin-bottom: 4px; }
  #panel .sub { font-family: var(--serif); font-style: italic; font-size: 15px; color: var(--text); margin-bottom: 12px; }
  #panel p { font-size: 11px; line-height: 1.7; color: #c8c8d0; margin-bottom: 12px; }
  #panel .meta { font-size: 10px; color: var(--pink-dim); letter-spacing: 0.06em; margin-bottom: 12px; }
  #panel .links-title { font-size: 10px; color: var(--pink-dim); margin-bottom: 6px; letter-spacing: 0.08em; }
  #panel .links { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 14px; }
  #panel .links button {
    font-family: var(--pixel); font-size: 10px; color: var(--pink-soft); background: transparent;
    border: 1px dotted rgba(244, 166, 194, 0.55); padding: 2px 7px; cursor: pointer;
  }
  #panel .links button:hover { background: var(--pink); color: #0a080c; }
  #panel .back { font-size: 10px; color: var(--text-dim); }
  #panel .back button { font: inherit; color: var(--pink); background: none; border: 0; cursor: pointer; text-decoration: underline dotted; }

  @media (max-width: 700px) {
    #panel { right: 50%; top: auto; bottom: 52px; transform: translate(50%, 16px); }
    #panel.open { transform: translate(50%, 0); }
    header .hint { font-size: 9.5px; }
  }
</style>
</head>
<body>
  <header>
    <h1>@&#125;->-- natalie churchill // 10c f26 <span class="blink">♥</span></h1>
    <div class="hint">drag to orbit ⋆ scroll to zoom ⋆ click an image to travel to it</div>
  </header>

  <main id="stage" aria-label="3d web of projects — drag to orbit, scroll to zoom, click an image">
    <canvas id="web"></canvas>
    <div id="nodes"></div>
  </main>

  <aside id="panel" aria-live="polite"></aside>

  <div class="badge">✧ demo · web view (instead of the carousel) ✧</div>
  <div class="controls">
    <button class="btn" id="spin" aria-pressed="true" title="slow drift">drift ●</button>
    <button class="btn" id="home" title="back to the whole web">⌂ whole web</button>
  </div>

    const dist = (big ? 330 : 250) + rnd() * 130;
    const dir = out.map((o, k) => o * Math.cos(spread) + (a[k] * Math.cos(ang) + b[k] * Math.sin(ang)) * Math.sin(spread));
    n.pos = h.map((v, k) => v + dir[k] * dist);
  });
});

/* ---- threads: centre → projects, projects in a ring, pieces → project,
        and each piece to its two nearest neighbours (that's what makes it a web) ---- */
const EDGES = [];
const seen = new Set();
function link(a, b, kind) {
  const key = a < b ? a + '|' + b : b + '|' + a;
  if (a === b || seen.has(key)) return;
  seen.add(key);
  EDGES.push({ a: byId[a], b: byId[b], kind, phase: rnd(), speed: 0.08 + rnd() * 0.12 });
}
['p01', 'p02', 'p03', 'demos'].forEach((h) => link('about', h, 'main'));
link('p01', 'p02', 'main'); link('p02', 'demos', 'main'); link('demos', 'p03', 'main'); link('p03', 'p01', 'main');
NODES.filter((n) => n.parent).forEach((n) => link(n.id, n.parent, 'kid'));
const d2 = (p, q) => (p[0] - q[0]) ** 2 + (p[1] - q[1]) ** 2 + (p[2] - q[2]) ** 2;
NODES.filter((n) => n.parent).forEach((n) => {
  NODES.filter((m) => m !== n && m.id !== 'about')
    .sort((m1, m2) => d2(n.pos, m1.pos) - d2(n.pos, m2.pos))
    .slice(0, 2).forEach((m) => link(n.id, m.id, 'web'));
});
const neighbours = (n) => EDGES.filter((e) => e.a === n || e.b === n).map((e) => (e.a === n ? e.b : e.a));

/* ---- build the image cards ---------------------------------------------- */
const layer = document.getElementById('nodes');
NODES.forEach((n, i) => {
  const el = document.createElement('div');
  el.className = 'node ' + (n.hub ? 'hub' : 'sat') + (n.icon ? ' icon' : '');
  el.style.setProperty('--w', (n.hub ? 170 : 104) + 'px');
  el.innerHTML = '<div class="frame"><img alt=""></div><div class="lbl"></div>';
  el.querySelector('img').src = IMGS[n.img].src;
  el.querySelector('img').alt = n.title;
  el.querySelector('.lbl').textContent = n.label;
  el.dataset.id = n.id;
  el.addEventListener('pointerenter', () => { hover = n; });
  el.addEventListener('pointerleave', () => { if (hover === n) hover = null; });
  layer.appendChild(el);
  n.el = el;
  n.born = 300 + i * 70;            // they fade in one by one
});

/* ---- background: a faint field of ascii stars ---------------------------- */
const STAR_GLYPHS = ['·', '·', '˚', '⋆', '✦', '·', '.', '✧'];
const STARS = Array.from({ length: 240 }, () => {
  const u = rnd() * 2 - 1, t = rnd() * Math.PI * 2, r = 1600 + rnd() * 1600;
  const s = Math.sqrt(1 - u * u);
  return { pos: [r * s * Math.cos(t), r * u, r * s * Math.sin(t)], ch: STAR_GLYPHS[Math.floor(rnd() * STAR_GLYPHS.length)], tw: rnd() * 6.28 };
});

/* ---- camera -------------------------------------------------------------- */
const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;
const FOCAL = 900;
const HOME = { tx: 0, ty: 0, tz: 0, dist: 1500, ox: 0 };
const cam = { yaw: 0.6, pitch: -0.18, ...HOME };
const goal = { ...HOME };
let velYaw = 0, velPitch = 0, drift = !reduceMotion, lastInput = 0;
let focused = null, hover = null;

const canvas = document.getElementById('web');
const ctx = canvas.getContext('2d');
let W = 0, H = 0, DPR = 1;
function resize() {
  DPR = Math.min(2, devicePixelRatio || 1);
  W = innerWidth; H = innerHeight;
  canvas.width = W * DPR; canvas.height = H * DPR;
}
addEventListener('resize', resize);
resize();

function project(p) {
  const x = p[0] - cam.tx, y = p[1] - cam.ty, z = p[2] - cam.tz;
  const cy = Math.cos(cam.yaw), sy = Math.sin(cam.yaw);
  const x1 = x * cy - z * sy, z1 = x * sy + z * cy;
  const cp = Math.cos(cam.pitch), sp = Math.sin(cam.pitch);
  const y1 = y * cp - z1 * sp, z2 = y * sp + z1 * cp;
  const depth = z2 + cam.dist;
  if (depth < 60) return null;
  const f = FOCAL / depth;
  return { x: W / 2 + cam.ox + x1 * f, y: H / 2 + y1 * f, s: f, depth };
}
// further away = fainter, like fog
const fog = (depth) => Math.max(0.12, Math.min(1, 1.35 - (depth - cam.dist * 0.55) / (cam.dist * 1.25)));

/* ---- focus: fly to an image and open its info ---------------------------- */
const panel = document.getElementById('panel');
function focusNode(n) {
  focused = n;
  goal.tx = n.pos[0]; goal.ty = n.pos[1]; goal.tz = n.pos[2];
  goal.dist = n.hub ? 520 : 400;
  goal.ox = innerWidth > 700 ? -Math.min(200, innerWidth * 0.14) : 0;
  goal.oy = 0;
  const near = neighbours(n);
  panel.innerHTML =
    '<h2>⋆*✩ ' + esc(n.title) + ' ✩*⋆</h2>' +
    '<div class="sub">' + esc(n.sub || '') + '</div>' +
    (n.text ? '<p>' + esc(n.text) + '</p>' : '') +
    (n.meta ? '<div class="meta">' + esc(n.meta) + '</div>' : '') +
    '<div class="links-title">threads to:</div><div class="links">' +
    near.map((m) => '<button data-go="' + m.id + '">' + esc(m.hub ? m.label.replace(/⋆/g, '').trim() : m.label) + '</button>').join('') +
    '</div><div class="back">[ <button data-home>back to the whole web</button> · esc ]</div>';
  panel.classList.add('open');
  lastInput = performance.now();
}
function goHome() {
  focused = null;
  Object.assign(goal, HOME);
  panel.classList.remove('open');
}
function esc(s) { return String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c])); }
panel.addEventListener('click', (e) => {
  const go = e.target.closest('[data-go]');
  if (go) focusNode(byId[go.dataset.go]);
  if (e.target.closest('[data-home]')) goHome();
});
document.getElementById('home').addEventListener('click', goHome);
const spinBtn = document.getElementById('spin');
function renderSpin() { spinBtn.textContent = 'drift ' + (drift ? '●' : '◌'); spinBtn.classList.toggle('on', drift); spinBtn.setAttribute('aria-pressed', String(drift)); }
spinBtn.addEventListener('click', () => { drift = !drift; renderSpin(); });
renderSpin();
addEventListener('keydown', (e) => { if (e.key === 'Escape') goHome(); });

/* ---- input: drag to orbit, scroll to zoom, click to travel --------------- */
const stage = document.getElementById('stage');
let dragging = false, downX = 0, downY = 0, lastX = 0, lastY = 0, moved = 0;
stage.addEventListener('pointerdown', (e) => {
  dragging = true; moved = 0;
  downX = lastX = e.clientX; downY = lastY = e.clientY;
  stage.setPointerCapture(e.pointerId);
  stage.classList.add('dragging');
  velYaw = velPitch = 0;
  lastInput = performance.now();
});
stage.addEventListener('pointermove', (e) => {
  if (!dragging) return;
  const dx = e.clientX - lastX, dy = e.clientY - lastY;
  lastX = e.clientX; lastY = e.clientY;
  moved = Math.max(moved, Math.hypot(e.clientX - downX, e.clientY - downY));
  velYaw = dx * 0.005; velPitch = dy * 0.004;
  cam.yaw += velYaw; cam.pitch = clampPitch(cam.pitch + velPitch);
  lastInput = performance.now();
});
function endDrag(e) {
  if (!dragging) return;
  dragging = false;
  stage.classList.remove('dragging');
  if (moved < 6) {
    stage.releasePointerCapture?.(e.pointerId);
    const hit = document.elementFromPoint(e.clientX, e.clientY);
    const el = hit && hit.closest('.node');
    if (el) focusNode(byId[el.dataset.id]);
    else if (focused) goHome();
  }
}
stage.addEventListener('pointerup', endDrag);
stage.addEventListener('pointercancel', endDrag);
const clampPitch = (p) => Math.max(-1.25, Math.min(1.25, p));
addEventListener('wheel', (e) => {
  e.preventDefault();
  let d = e.deltaY;
  if (e.deltaMode === 1) d *= 30;
  goal.dist = Math.max(260, Math.min(3000, goal.dist * Math.exp(d * 0.0012)));
  lastInput = performance.now();
}, { passive: false });

/* ---- draw ---------------------------------------------------------------- */
const start = performance.now();
let lastT = start;
function frame(now) {
  requestAnimationFrame(frame);
  const dt = Math.min(0.05, (now - lastT) / 1000);
  lastT = now;
  const t = (now - start) / 1000;

  // camera easing + momentum + slow drift
  const k = 1 - Math.pow(0.0025, dt);           // smooth, frame-rate independent
  ['tx', 'ty', 'tz', 'dist', 'ox'].forEach((p) => { cam[p] += (goal[p] - cam[p]) * k; });
  if (!dragging) {
    cam.yaw += velYaw; cam.pitch = clampPitch(cam.pitch + velPitch);
    velYaw *= 0.92; velPitch *= 0.9;
    if (drift && now - lastInput > 2500) cam.yaw += dt * (focused ? 0.025 : 0.06);
  }

  // nodes
  const hot = focused || hover;
  const hotSet = new Set(hot ? [hot, ...neighbours(hot)] : []);
  NODES.forEach((n) => {
    const p = project(n.pos);
    n.p = p;
    if (!p) { n.el.style.opacity = 0; return; }
    const appear = Math.min(1, Math.max(0, (now - start - n.born) / 600));
    let a = fog(p.depth) * appear;
    if (hot && !hotSet.has(n)) a *= 0.28;
    // anything right up against the camera fades out so it doesn't block the view
    a *= Math.min(1, Math.max(0, (p.depth - 140) / 260));
    if (focused && n !== focused && focused.p && p.depth < focused.p.depth * 0.8) a *= 0.35;
    n.el.style.opacity = a.toFixed(3);
    n.el.style.zIndex = String(10000 - Math.round(p.depth));
    n.el.style.transform = 'translate3d(' + p.x.toFixed(1) + 'px,' + p.y.toFixed(1) + 'px,0) translate(-50%,-50%) scale(' + p.s.toFixed(3) + ')';
    n.el.classList.toggle('hot', n === hot);
    n.el.classList.toggle('near', !!hot && hotSet.has(n) && n !== hot);
  });

  // threads + stars
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  ctx.clearRect(0, 0, W, H);
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';

  ctx.font = "12px 'Space Mono', monospace";
  STARS.forEach((s) => {
    const p = project(s.pos);
    if (!p) return;
    const tw = 0.35 + 0.35 * Math.sin(t * 0.8 + s.tw);
    ctx.fillStyle = 'rgba(158,107,127,' + (tw * 0.6).toFixed(3) + ')';
    ctx.fillText(s.ch, p.x, p.y);
  });

  EDGES.forEach((e) => {
    const p = e.a.p, q = e.b.p;
    if (!p || !q) return;
    const appear = Math.min(1, Math.max(0, (now - start - Math.max(e.a.born, e.b.born)) / 600));
    const lit = hot && (e.a === hot || e.b === hot);
    let a = Math.min(fog(p.depth), fog(q.depth)) * appear * (e.kind === 'main' ? 0.7 : e.kind === 'kid' ? 0.5 : 0.32);
    if (hot) a *= lit ? 2.2 : 0.35;
    ctx.strokeStyle = 'rgba(244,166,194,' + Math.min(0.95, a).toFixed(3) + ')';
    ctx.lineWidth = lit ? 1.3 : 1;
    ctx.setLineDash(lit ? [] : [2, 4]);
    ctx.beginPath(); ctx.moveTo(p.x, p.y); ctx.lineTo(q.x, q.y); ctx.stroke();

    // a little spark travelling along each thread
    if (!reduceMotion) {
      const u = (e.phase + t * e.speed) % 1;
      const mid = project(e.a.pos.map((v, i) => v + (e.b.pos[i] - v) * u));
      if (mid) {
        ctx.font = Math.max(7, 12 * mid.s).toFixed(1) + "px 'Space Mono', monospace";
        ctx.fillStyle = 'rgba(251,207,232,' + Math.min(1, a * 1.8).toFixed(3) + ')';
        ctx.fillText(lit ? '✦' : '·', mid.x, mid.y);
      }
    }
  });
  ctx.setLineDash([]);
}
requestAnimationFrame(frame);
</script>
</body>
</html>
